# The node export (Export Node button) reads content from any workspace - only for administrators, i.e. the
# developers who write the tests. The button asks the same privilege target (see Settings.yaml frontendConfiguration).
privilegeTargets:
  'Neos\Flow\Security\Authorization\Privilege\Method\MethodPrivilege':
    'Sandstorm.E2ETestTools:NodeExport':
      matcher: 'method(Sandstorm\E2ETestTools\Controller\NodeExportController->.*Action())'

roles:
  'Neos.Neos:Administrator':
    privileges:
      - privilegeTarget: 'Sandstorm.E2ETestTools:NodeExport'
        permission: GRANT
