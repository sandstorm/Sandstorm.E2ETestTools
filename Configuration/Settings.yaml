Neos:
  Neos:
    fusion:
      autoInclude:
        Sandstorm.E2ETestTools: true
    Ui:
      resources:
        javascript:
          'Sandstorm.E2ETestTools/ExportNodeButton':
            resource: resource://Sandstorm.E2ETestTools/Public/ExportNodeButton/Plugin.js
        stylesheets:
          'Sandstorm.E2ETestTools/ExportNodeButton':
            resource: 'resource://Sandstorm.E2ETestTools/Public/ExportNodeButton/Plugin.css'
      frontendConfiguration:
        'Sandstorm.E2ETestTools:ExportNodeButton':
          # evaluated per request for the logged-in user - the button is disabled for everybody who may not export
          enabled: '${Security.hasAccess("Sandstorm.E2ETestTools:NodeExport")}'

  Flow:
    object:
      includeClasses:
        # composer.json autoloads all of Tests/ (the Behat traits live there) - keep the PHPUnit tests out of Flow's
        # reflection, their base classes only exist when running PHPUnit
        'Sandstorm.E2ETestTools': ['Sandstorm\\E2ETestTools\\(?!Tests\\(Unit|Functional)\\).*']
    security:
      authentication:
        providers:
          'Neos.Neos:Backend':
            requestPatterns:
              # the export button's controller lives outside the Neos namespaces - without this, the backend login
              # wouldn't apply to it and Policy.yaml would deny every request
              'Sandstorm.E2ETestTools:NodeExport':
                pattern: ControllerObjectName
                patternOptions:
                  controllerObjectNamePattern: 'Sandstorm\E2ETestTools\Controller\NodeExportController'
    mvc:
      routes:
        'Sandstorm.E2ETestTools':
          position: 'before Neos.Neos'
          variables:
            pageSeparator: '~p'
            defaultUriSuffix: '.html'
    reflection:
      # specify more tags to be ignored during reflection
      ignoredTags:
        'BeforeSuite': true
        'AfterSuite': true
        'playwright': true
