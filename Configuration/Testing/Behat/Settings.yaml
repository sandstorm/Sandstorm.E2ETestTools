Neos:
  Flow:
    http:
      # we want to be able to link to resources or nodes, so we need a base URI
      baseUri: '/'
  ContentRepositoryRegistry:
    presets:
      default:
        # the fixture steps run as CLI process without a logged-in user - grant them every node and workspace
        # permission (the system under test still applies yours)
        authProvider:
          factoryObjectName: Neos\ContentRepositoryRegistry\Factory\AuthProvider\StaticAuthProviderFactory
