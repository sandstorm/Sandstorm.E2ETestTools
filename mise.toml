# Development distribution of Sandstorm.E2ETestTools (see "Development distribution" in CONTRIBUTING.md).
#
# mise trust                      # once
# mise install                    # the tools below (node for the trace viewer, gum for the choosers)
# mise run build                  # build the images (again after changing a composer.json or the Dockerfile)
# mise run start                  # start the distribution and wait until the system under test answers
# mise run tests:run              # unit, functional and E2E tests
# mise run tests:e2e:runSingle    # one feature or scenario - without a path, choose the feature
# mise run tests:e2e:openTrace    # open a trace - without a file, choose one
#
# SUT selects the distribution in Tests/SystemUnderTest/<SUT>/ (default: neos9), e.g. `SUT=neos9 mise run start`.
#
# TASK STRUCTURE (`mise tasks` lists all, `mise run <task> --help` shows the flags)
# - managing the distribution (build, start, stop, down, logs, enter) lives here
# - tests are file tasks in mise/tasks/tests/ - the folders are the table of contents: mise/tasks/tests/e2e/runAll.sh
#   is tests:e2e:runAll. mise/scripts/ holds helpers that are no tasks (e2e-lib.sh)
# - NEVER define a task here whose name or group clashes with mise/tasks/ - a group lives here or in its folder
# - names: group:verbObject, group:run is the main task of a group, no aliases - like the Neos kickstart
# - inside a project (package as submodule) mise also lists the project's tasks; ours win on the same name

[tools]
node = "24.21.0"
gum = "2.0.1"

[settings]
# quiet: mise would otherwise echo the first script line of every task as "[task] $ ..." header
quiet = true

[vars]
compose = "docker compose -f {{config_root}}/Tests/SystemUnderTest/{{ get_env(name='SUT', default='neos9') }}/docker-compose.yml"

######################## Docker Management ########################

[tasks.build]
description = "Build the images of the distribution"
run = "{{vars.compose}} build --pull"

[tasks.start]
description = "Start the distribution and wait until the system under test answers"
run = '''
mkdir -p "{{config_root}}/Tests/SystemUnderTest/e2e-results"
# bind-mounted into the container, where Behat writes as www-data - on Linux (e.g. CI) the directory belongs to the host
# user, so screenshots, traces and log copies would fail with "Permission denied"
chmod a+rwx "{{config_root}}/Tests/SystemUnderTest/e2e-results"
{{vars.compose}} up -d
echo "Waiting for the system under test (first start: migrations, cr:setup)..."
for i in $(seq 1 120); do
  if {{vars.compose}} exec -T neos curl --silent --fail --output /dev/null http://localhost:9090/neos/login; then
    echo "System under test is up: http://127.0.0.1:19090"
    exit 0
  fi
  sleep 2
done
echo "System under test did not come up - see: mise run logs"
exit 1
'''

[tasks.stop]
description = "Stop the containers"
run = "{{vars.compose}} stop"

[tasks.down]
description = "Remove the containers, networks and volumes of the distribution"
run = "{{vars.compose}} down --volumes --remove-orphans"

[tasks.logs]
description = "Follow the container logs (optionally pass service names)"
run = "{{vars.compose}} logs -f"

[tasks.enter]
description = "Open a shell in the neos container"
run = "{{vars.compose}} exec neos bash"

######################## Testing ########################

# tests:run, tests:unit, tests:functional and tests:e2e:* are file tasks in mise/tasks/tests/
